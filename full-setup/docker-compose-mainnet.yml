services:
  bitcoin:
    container_name: bitcoin
    build:
      context: ./docker/bitcoin
      dockerfile: Dockerfile
    restart: unless-stopped
    stop_grace_period: 30s
    networks:
      - bitcoin
    ports:
      - "127.0.0.1:8332:8332/tcp"
      - "0.0.0.0:8333:8333/tcp"
    command: >
      -printtoconsole
      -datadir=/app/data
    volumes:
      - "./data/mainnet/bitcoin:/app/data"
      - "./bitcoin-mainnet.conf:/app/data/bitcoin.conf:ro"

  timescaledb:
    image: timescale/timescaledb:latest-pg17
    container_name: public-pool-mainnet-timescaledb
    restart: unless-stopped
    networks:
      - bitcoin
    environment:
      POSTGRES_DB: public_pool_mainnet
      POSTGRES_USER: public_pool
      POSTGRES_PASSWORD: public_pool
    command:
      - postgres
      - -c
      - max_wal_size=16GB
      - -c
      - min_wal_size=2GB
      - -c
      - checkpoint_timeout=15min
      - -c
      - checkpoint_completion_target=0.9
      - -c
      - wal_compression=on
    volumes:
      - "./data/mainnet/timescaledb:/var/lib/postgresql/data"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U public_pool -d public_pool_mainnet"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: redis:8-alpine
    container_name: public-pool-mainnet-redis
    restart: unless-stopped
    networks:
      - bitcoin
    volumes:
      - "./data/mainnet/redis:/data"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  public-pool:
    container_name: public-pool
    build:
      context: ..
      dockerfile: Dockerfile
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - bitcoin
    ports:
      - "0.0.0.0:3333:3333/tcp"
      - "0.0.0.0:3332:3332/tcp"
      - "0.0.0.0:3331:3331/tcp"
      - "0.0.0.0:3330:3330/tcp"
      - "0.0.0.0:4333:4333/tcp"
      - "0.0.0.0:4332:4332/tcp"
      - "0.0.0.0:4331:4331/tcp"
      - "0.0.0.0:4330:4330/tcp"
      - "${API_BIND_HOST:-127.0.0.1}:${API_PUBLIC_PORT:-3334}:3334/tcp"
    volumes:
      - "./public-pool-mainnet.env:/public-pool/.env:ro"
      - "../secrets:/public-pool/secrets:ro"
    environment:
      NODE_ENV: production
      DB_HOST: timescaledb
      DB_PORT: 5432
      DB_USERNAME: public_pool
      DB_PASSWORD: public_pool
      DB_DATABASE: public_pool_mainnet
      REDIS_URL: redis://redis:6379
      API_PORT: ${API_PORT:-3334}
      API_SECURE: ${API_SECURE:-false}
      API_MAX_CONNECTIONS: ${API_MAX_CONNECTIONS:-10000}
      API_REQUEST_TIMEOUT_MS: ${API_REQUEST_TIMEOUT_MS:-15000}
      API_HEADERS_TIMEOUT_MS: ${API_HEADERS_TIMEOUT_MS:-10000}
      API_KEEP_ALIVE_TIMEOUT_MS: ${API_KEEP_ALIVE_TIMEOUT_MS:-5000}
      API_SOCKET_TIMEOUT_MS: ${API_SOCKET_TIMEOUT_MS:-0}
      API_TLS_HANDSHAKE_TIMEOUT_MS: ${API_TLS_HANDSHAKE_TIMEOUT_MS:-10000}
      API_LISTEN_BACKLOG: ${API_LISTEN_BACKLOG:-1024}
      API_NODE_ARGS: ${API_NODE_ARGS:---max-old-space-size=512}
      API_MAX_MEMORY_RESTART: ${API_MAX_MEMORY_RESTART:-768M}
      API_KILL_TIMEOUT_MS: ${API_KILL_TIMEOUT_MS:-5000}
      API_RESTART_DELAY_MS: ${API_RESTART_DELAY_MS:-2000}
      PM2_ENABLED: "true"
      STRATUM_WORKERS: ${STRATUM_WORKERS:-2}

networks:
  bitcoin:
